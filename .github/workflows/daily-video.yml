
name: Create and publish Gopal Bhar cartoon

on:
  workflow_dispatch:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় রাত ৮:৩০
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: gopal-bhar-daily-video
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          ffmpeg -version
          fc-list :lang=bn family | head -20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required project files
        run: |
          test -f create_video.py
          test -f publish_video.py
          test -f requirements.txt
          test -f stories/stories.json

      - name: Generate cartoon video
        run: |
          python create_video.py
          test -s output/gopal_bhar.mp4

      - name: Publish to Facebook Page if secrets exist
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          GRAPH_API_VERSION: v26.0
        run: |
          if [ -n "$PAGE_ID" ] && [ -n "$PAGE_ACCESS_TOKEN" ]; then
            python publish_video.py
          else
            echo "Facebook secrets not configured."
            echo "Video generated successfully; Facebook upload skipped."
          fi

      - name: Save generated video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gopal-bhar-video
          path: output/gopal_bhar.mp4
          if-no-files-found: warn
          retention-days: 3
